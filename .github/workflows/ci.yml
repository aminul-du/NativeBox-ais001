name: MCore CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "fix/**"]

permissions: {}

jobs:
  repository-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f .gitignore
          test -f .env.example
          test -f docker-compose.yml
          test -f scripts/audit-repo.sh
          test -f scripts/validate-compose.sh
          test -f scripts/deploy.sh
          test -f docs/deployment/staged-rollout.md

      - name: Check tracked secret-like files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|\.env\..+|id_rsa|.*\.pem|.*\.key)$' | grep -vE '(^|/)\.env\.example$'; then
            echo "Potential secret-bearing file is tracked; inspect before merge." >&2
            exit 1
          fi

      - name: Validate Compose model
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet

      - name: Report provisional status
        run: |
          echo "Bootstrap validation only."
          echo "Application build, tests and production deployment are not certified."
